<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tinggi World">
  <!-- Dunkler Hintergrund mit abgerundeten Ecken -->
  <rect x="0" y="0" width="64" height="64" rx="12" ry="12" fill="#06070C"/>

  <!-- Subtle KI-Grid-Textur (kaum sichtbar) -->
  <g stroke="#EDEEF1" stroke-opacity="0.06" stroke-width="0.5">
    <line x1="0"  y1="16" x2="64" y2="16"/>
    <line x1="0"  y1="32" x2="64" y2="32"/>
    <line x1="0"  y1="48" x2="64" y2="48"/>
    <line x1="16" y1="0"  x2="16" y2="64"/>
    <line x1="32" y1="0"  x2="32" y2="64"/>
    <line x1="48" y1="0"  x2="48" y2="64"/>
  </g>
  <g fill="#DA774A" fill-opacity="0.18">
    <circle cx="16" cy="16" r="0.9"/>
    <circle cx="32" cy="32" r="0.9"/>
    <circle cx="48" cy="48" r="0.9"/>
  </g>

  <!-- Sanfter Orange-Glow hinter dem T -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="55%" r="55%">
      <stop offset="0%"   stop-color="#DA774A" stop-opacity="0.35"/>
      <stop offset="60%"  stop-color="#DA774A" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#DA774A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="36" r="22" fill="url(#glow)"/>

  <!-- Grosses T in Orange, geometrisch sauber -->
  <g fill="#DA774A">
    <!-- Querbalken -->
    <rect x="14" y="18" width="36" height="7" rx="1.5"/>
    <!-- Vertikaler Stamm -->
    <rect x="28.5" y="18" width="7" height="32" rx="1.5"/>
  </g>
</svg>
